name: Compiler checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q backend frontend utils main.py

      - name: Lower example programs
        run: |
          python main.py --input example.c --parse > /tmp/example.ast
          python main.py --input example.c --tac > /tmp/example.tac
          python main.py --input example.c --riscv > /tmp/example.s
          python main.py --input examples/control_flow.c --riscv > /tmp/control_flow.s
          test -s /tmp/example.ast
          test -s /tmp/example.tac
          test -s /tmp/example.s
          test -s /tmp/control_flow.s
          grep -q "call fib" /tmp/example.s
